<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6600aa"/>
      <stop offset="100%" stop-color="#aa33ff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa33ff"/>
      <stop offset="100%" stop-color="#ff66ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="#0a0010"/>

  <!-- ===================== PRIMARY LOCKUP (icon + wordmark) ===================== -->
  <g transform="translate(90,150)">

    <!-- Icon: three offset stacked layers forming an implied "A" / stack silhouette -->
    <g filter="url(#glow)">
      <rect x="0" y="130" width="200" height="34" rx="8" fill="url(#grad1)" opacity="0.55"/>
      <rect x="24" y="80" width="152" height="34" rx="8" fill="url(#grad1)" opacity="0.8"/>
      <rect x="48" y="30" width="104" height="34" rx="8" fill="url(#grad2)"/>
      <!-- cursor notch referencing code/dev -->
      <path d="M85 0 L100 30 L115 0 Z" fill="url(#grad2)"/>
    </g>

    <!-- Wordmark -->
    <text x="240" y="115" font-family="Syne, sans-serif" font-weight="700" font-size="92" fill="#ffffff">aak<tspan fill="url(#grad1)">Stack</tspan></text>
    <text x="242" y="155" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="6" fill="rgba(240,230,255,0.45)">AI &#183; FULL-STACK &#183; AUTOMATION</text>
  </g>

  <!-- ===================== ICON-ONLY MARK (for favicon/avatar use) ===================== -->
  <g transform="translate(950,90)">
    <circle cx="110" cy="160" r="150" fill="#160020" stroke="url(#grad1)" stroke-width="2"/>
    <g filter="url(#glow)" transform="translate(45,90)">
      <rect x="0" y="115" width="130" height="24" rx="6" fill="url(#grad1)" opacity="0.55"/>
      <rect x="16" y="80" width="98" height="24" rx="6" fill="url(#grad1)" opacity="0.8"/>
      <rect x="32" y="45" width="66" height="24" rx="6" fill="url(#grad2)"/>
      <path d="M55 20 L65 44 L75 20 Z" fill="url(#grad2)"/>
    </g>
  </g>

</svg>
